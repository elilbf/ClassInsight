services:
  classinsight:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: classinsight
    ports:
      - "8082:8082"
    networks:
      - classinsight-network
    restart: unless-stopped
    depends_on:
      - user-postgres
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  user-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classinsight_db
      POSTGRES_USER: classinsight_user
      POSTGRES_PASSWORD: classinsight_pass
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - classinsight-network
    restart: unless-stopped

volumes:
  user_postgres_data: